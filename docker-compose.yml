name: petal
services:
  timescale:
    build: services/timescale
    image: petal-timescale:latest
    restart: unless-stopped
    volumes:
    - timescale-data:/var/lib/postgresql/data
    - ./services/schema/system.sql:/docker-entrypoint-initdb.d/100_system.sql:ro
    - ./services/schema/functions.sql:/docker-entrypoint-initdb.d/101_functions.sql:ro
    - ./services/schema/schema.sql:/docker-entrypoint-initdb.d/102_schema.sql:ro
    networks:
      - internal
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: petal
      POSTGRES_DB: petal
    # This does not need to be adjusted, unless you actually want to limit it
    # Postgres uses shared memory for caching, and docker assigns just 64 MB by default
    shm_size: '128g'

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile-frontend
    image: petal-frontend:latest
    restart: unless-stopped
    ports:
      - "${UI_BIND:-0.0.0.0}:${UI_PORT:-3000}:3000"
    expose:
      - 3000
    depends_on:
      - timescale
      - api
    networks:
      - internal
    environment:
      API_SERVER_ENDPOINT: http://api:5000/

  api:
    build:
      context: services/api
      dockerfile: Dockerfile-api
    image: petal-api:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - setup-sock:/run/petal
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro
    environment:
      PETAL_PASSWORD_HASH: ${PETAL_PASSWORD_HASH:-}
      PETAL_SECRET: ${PETAL_SECRET:-}
      PETAL_CONFIGURED: ${PETAL_CONFIGURED:-0}
      TIMESCALE: ${TIMESCALE}
      PETAL_TRAFFIC_DIR: ${TRAFFIC_DIR_DOCKER}
      FLAG_REGEX: ${FLAG_REGEX}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      VM_IP: ${VM_IP}
      SERVICES: ${SERVICES_UI:-${SERVICES:-}}

  flagids:
    restart: unless-stopped
    build:
      context: services/flagids
    image: petal-flagids:latest
    depends_on:
      - timescale
    networks:
      - internal
    environment:
      TIMESCALE: ${TIMESCALE}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCRAPE: ${FLAGID_SCRAPE}
      TEAM_ID: ${TEAM_ID}
      FLAGID_ENDPOINT: ${FLAGID_ENDPOINT}
      VISUALIZER_URL: ${VISUALIZER_URL}
      DUMP_PCAPS: ${DUMP_PCAPS}

  assembler:
    build:
      context: services/go-importer
      dockerfile: Dockerfile-assembler
    image: petal-assembler:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
    # Command line flags most likely to fix a petal issue:
    # - -http-session-tracking: enable HTTP session tracking
    # - -dir: directory to read traffic from
    # - -skipchecksum: skip checksum validation
    # - -flush-after: i.e. 2m Not needed in pcap rotation mode
    # - -disable-converters: disable converters
    # - -discard-extra-data: dont split large flow items, just discard them
    command: "./assembler -http-session-tracking -skipchecksum -disable-converters -dir ${TRAFFIC_DIR_DOCKER}"
    environment:
      TIMESCALE: ${TIMESCALE}
      FLAG_REGEX: ${FLAG_REGEX}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      VPN_RANGES: ${VPN_RANGES:-}
      TICK_START: ${TICK_START}
      TICK_LENGTH: ${TICK_LENGTH}
      FLAGID_SCAN: ${FLAGID_SCAN}
      FLAG_LIFETIME: ${FLAG_LIFETIME}
      FLAG_VALIDATOR_TYPE: ${FLAG_VALIDATOR_TYPE}
      FLAG_VALIDATOR_TEAM: ${FLAG_VALIDATOR_TEAM}
      PCAP_OVER_IP: ${PCAP_OVER_IP}
      DUMP_PCAPS: ${DUMP_PCAPS}
      DUMP_PCAPS_INTERVAL: ${DUMP_PCAPS_INTERVAL}
      DUMP_PCAPS_FILENAME: ${DUMP_PCAPS_FILENAME}
      BPF: ${BPF}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  enricher:
    build:
      context: services/go-importer
      dockerfile: Dockerfile-enricher
    image: petal-enricher:latest
    restart: unless-stopped
    depends_on:
      - timescale
    networks:
      - internal
    volumes:
      - ${TRAFFIC_DIR_HOST}:${TRAFFIC_DIR_DOCKER}:ro,z
    command: "./enricher -eve ${TRAFFIC_DIR_DOCKER}/eve.json"
    environment:
      TIMESCALE: ${TIMESCALE}

  capture:
    build: services/capture
    image: petal-capture:latest
    restart: unless-stopped
    # Host networking so tcpdump sees the real host interfaces
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ${TRAFFIC_DIR_HOST}:/traffic
    environment:
      CAPTURE_IFACE: ${CAPTURE_IFACE:-}
      CAPTURE_FILTER: ${CAPTURE_FILTER:-tcp}
      CAPTURE_ROTATE: ${CAPTURE_ROTATE:-60}

  # Setup helper for the dashboard's setup page: Docker + host network access, reachable only through
  # the unix socket in the setup-sock volume (shared with the api), never over TCP.
  setup:
    build: services/setup
    image: petal-setup:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PETAL_HOME:-.}:${PETAL_HOME:-/petal}
      - setup-sock:/run/petal
    environment:
      PETAL_HOME: ${PETAL_HOME:-/petal}

volumes:
  setup-sock:
  timescale-data:

networks:
  internal:
