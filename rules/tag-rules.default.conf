# Petal tag rules: every new flow that matches gets the tag (shown and filterable in the dashboard).
#
#   tag = regex          match what the client sent (requests, exploit payloads)
#   tag @out = regex     match what the service answered (leaks)
#   tag @bin = regex     match raw bytes (binary protocols), can be combined with @out
#
# URL-encoded payloads (%3b, %2e%2e, %7b%7b ...) are matched too where it matters.
# Rules see headers and body, as sent and decoded: JSON escapes, URL encoding (also double),
# base64 values that decode to text and gzip/deflate request bodies.
# Tags: a-z 0-9 _ -  (max 40). Regex: Go/RE2 syntax, (?i) = ignore case. Lines starting with # are
# comments. Edit on the Settings page; changes apply to new flows within a few seconds.
# Tip: when you spot an exploit, add a rule for it (e.g. "recipe-sqli = /search\?q=.*union") to see
# every later attempt, who sends it and whether your patch holds.

sqli = (?i)union(\s|/\*.*?\*/|%20|\+)+(all(\s|%20|\+)+)?select|'\s*or\s+'?1'?\s*=\s*'?1|(sleep|benchmark|pg_sleep)\s*\(
path-traversal = (?i)\.\./\.\./|\.\.\\\.\.\\|%2e%2e(%2f|/)|\.\.%2f
cmd-injection = (?i)(;|%3b|\|\||%7c%7c|&&|%26%26|\$\(|%24%28|`|%60)(\s|%20|\+)*(cat|ls|id|whoami|uname|sh|bash|nc|ncat|curl|wget|python3?)\b
template-injection = (?i)\{\{.{0,200}\}\}|\{%.{0,200}%\}|\$\{.{0,200}\}|%7b%7b.{0,200}%7d%7d|%7b%25.{0,200}%25%7d
xss = (?i)(<|%3c)script|onerror(\s|%20)*(=|%3d)|javascript:
leak-passwd @out = root:x:0:0:

# Binary / pwn services (raw TCP). '@bin' matches raw bytes: \x90 is the byte 0x90 and (?s) lets . match
# any byte. Payloads written as text ('\x90\x90...') are decoded to bytes first.
nop-sled @bin = \x90{16,}
shellcode @bin = \x31\xc0\x50\x68\x2f\x2f\x73\x68|\x48\x31\xf6\x56\x48\xbf|\x6a\x3b\x58\x99|/bin//sh
format-string = (%([0-9]{1,3}\$)?(0[0-9]{0,2})?[hl]{0,2}[pxsdn][^%\n]{0,3}){4,}|%[0-9]{1,3}\$[hl]{0,2}n
overflow-pattern = A{64,}|B{64,}|aaaabaaacaaadaaa|Aa0Aa1Aa2Aa3
rop-chain @bin = (?s)(.{5}[\x55\x56\x7f]\x00\x00){4,}
